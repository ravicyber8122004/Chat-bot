<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Cyberpunk Chatbot with Voice Input</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0f13; /* Dark background */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .chat-container {
      width: 480px;
      max-height: 700px;
      background: rgba(15, 18, 21, 0.9); /* Semi-transparent dark background */
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); /* Glowing border effect */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #00ff99;
    }

    .chat-header {
      background: #00ff99;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #00b3b3;
      box-shadow: 0 4px 15px rgba(0, 255, 255, 0.5);
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      background: rgba(15, 18, 21, 0.9);
      overflow-y: auto;
      border-bottom: 2px solid #00b3b3;
    }

    .message {
      margin: 10px 0;
      padding: 12px 20px;
      border-radius: 15px;
      max-width: 80%;
      clear: both;
      font-size: 16px;
      line-height: 1.6;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .user {
      background: #00b3b3;
      color: #fff;
      float: right;
      text-align: right;
      border-top-right-radius: 0;
    }

    .bot {
      background: #444;
      color: #ddd;
      float: left;
      border-top-left-radius: 0;
    }

    .chat-input {
      display: flex;
      padding: 15px;
      background: #1b1b1b;
      border-top: 1px solid #444;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      background: #333;
      color: #fff;
      border-radius: 10px;
      font-size: 16px;
      box-shadow: 0 2px 5px rgba(0, 255, 255, 0.3);
    }

    .chat-input button,
    .chat-input .mic-btn {
      padding: 12px 18px;
      margin-left: 10px;
      background: #ff0080; /* Neon pink for futuristic contrast */
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(255, 0, 128, 0.3);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .chat-input button:hover,
    .chat-input .mic-btn:hover {
      background: #d5006b;
      transform: scale(1.05);
    }

    .chat-input .mic-btn {
      background: #00ff99; /* Neon green for the mic button */
    }

    .chat-input button:focus,
    .chat-input .mic-btn:focus {
      outline: none;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">Cyberpunk Chatbot</div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type or speak a message..." />
      <button onclick="sendMessage()">Send</button>
      <button class="mic-btn" onclick="startListening()">🎤</button>
    </div>
  </div>

  <script>
    let botDatabase = [];

    fetch('bot-replies.json')
      .then(response => response.json())
      .then(data => {
        botDatabase = data;
      })
      .catch(error => {
        console.error('Error loading bot-replies.json:', error);
      });

    function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      input.value = '';

      setTimeout(() => {
        const botReply = getBotReply(message);
        addMessage(botReply, 'bot');
        speakBotReply(botReply); // 🔊 Speak the reply
      }, 500);
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      messageDiv.innerText = text;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getBotReply(userMessage) {
      const message = userMessage.toLowerCase();
      for (let item of botDatabase) {
        for (let keyword of item.keywords) {
          if (message.includes(keyword)) {
            return item.reply;
          }
        }
      }
      return "Sorry, I don't understand that.";
    }

    function speakBotReply(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-IN'; // Indian English accent
      utterance.pitch = 1;      // Pitch of the voice
      utterance.rate = 1;       // Speaking speed
      speechSynthesis.speak(utterance);
    }

    // 🎤 Voice Input using Web Speech API
    function startListening() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-IN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.start();

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('user-input').value = transcript;
        sendMessage();
      };

      recognition.onerror = function (event) {
        alert('Voice input failed: ' + event.error);
      };
    }
  </script>
</body>

</html>
