<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Chatbot with Voice Input</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 400px;
      max-height: 600px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #007bff;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e9ecef;
    }

    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      clear: both;
    }

    .user {
      background: #007bff;
      color: white;
      float: right;
      text-align: right;
    }

    .bot {
      background: #dee2e6;
      float: left;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ccc;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    .chat-input button, .chat-input .mic-btn {
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    .chat-input .mic-btn {
      background: #28a745;
    }

    .chat-input button:hover {
      background: #0056b3;
    }

    .chat-input .mic-btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">Chatbot with Voice</div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type or speak a message..." />
      <button onclick="sendMessage()">Send</button>
      <button class="mic-btn" onclick="startListening()">🎤</button>
    </div>
  </div>

  <script>
    let botDatabase = [];

    fetch('bot-replies.json')
      .then(response => response.json())
      .then(data => {
        botDatabase = data;
      })
      .catch(error => {
        console.error('Error loading bot-replies.json:', error);
      });

    function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      input.value = '';

      setTimeout(() => {
        const botReply = getBotReply(message);
        addMessage(botReply, 'bot');
      }, 500);
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      messageDiv.innerText = text;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getBotReply(userMessage) {
      const message = userMessage.toLowerCase();
      for (let item of botDatabase) {
        for (let keyword of item.keywords) {
          if (message.includes(keyword)) {
            return item.reply;
          }
        }
      }
      return "Sorry, I don't understand that.";
    }

    // 🎤 Voice Input using Web Speech API
    function startListening() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-IN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('user-input').value = transcript;
        sendMessage();
      };

      recognition.onerror = function(event) {
        alert('Voice input failed: ' + event.error);
      };
    }
  </script>
</body>
</html>
